    <script>
      (function () {
        if (!window.chatbase || window.chatbase("getState") !== "initialized") {
          window.chatbase = (...arguments) => {
            if (!window.chatbase.q) {
              window.chatbase.q = [];
            }
            window.chatbase.q.push(arguments);
          };
          window.chatbase = new Proxy(window.chatbase, {
            get(target, prop) {
              if (prop === "q") {
                return target.q;
              }
              return (...args) => target(prop, ...args);
            },
          });
        }
        const onLoad = function () {
          const script = document.createElement("script");
          script.src = "https://www.chatbase.co/embed.min.js";
          script.id = "k7iGrqT77yWDzO17x0LTx";
          script.domain = "www.chatbase.co";
          document.body.appendChild(script);
        };
        if (document.readyState === "complete") {
          onLoad();
        } else {
          window.addEventListener("load", onLoad);
        }

        const resizeChatbaseBubble = () => {
          const bubble = document.querySelector(
            "[id*='chatbase'], [class*='chatbase']",
          );
          if (!(bubble instanceof HTMLElement)) return;
          bubble.style.transform = `scale(${window.innerWidth <= 640 ? 0.5 : 1})`;
          bubble.style.transformOrigin = "bottom right";
        };
        new MutationObserver(resizeChatbaseBubble).observe(document.body, {
          childList: true,
          subtree: true,
        });
        window.addEventListener("load", resizeChatbaseBubble);
        window.addEventListener("resize", resizeChatbaseBubble);
      })();
    </script>
